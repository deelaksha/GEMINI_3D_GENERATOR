<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Board Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/studio.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span>Board Studio <small>PuzzleCore</small></div>
    <span class="sep"></span>
    <select id="design-select" class="input" title="Design"></select>
    <div class="seg" id="mode-seg">
      <button data-mode="design" class="on">Design</button>
      <button data-mode="production">Production</button>
    </div>
    <span class="spacer"></span>
    <span class="status-pill" id="status-pill"><span class="dot"></span><span>Loading…</span></span>
    <button class="btn" id="btn-validate" title="Run full validation (V)">Validate</button>
    <button class="btn ghost" id="btn-reset-boat" title="Rebuild the example boat through the join pipeline">Rebuild example</button>
    <a class="btn ghost" href="/assembly" title="Legacy JS model workbench">Legacy workbench</a>
  </header>

  <main class="main">
    <!-- Left: hierarchy -->
    <aside class="panel left">
      <div class="panel-head"><span>Components</span><span class="badge" id="comp-count">0</span></div>
      <div class="panel-body" id="tree"></div>
      <div class="panel-head" style="border-top:1px solid var(--border)"><span>Joints</span>
        <span><span class="badge" id="joint-count">0</span></span></div>
      <div class="panel-body" id="joint-list" style="max-height:34%"></div>
    </aside>

    <!-- Center: viewports -->
    <section class="center">
      <div class="viewbar">
        <div class="seg" id="layout-seg">
          <button data-layout="split" class="on">Split</button>
          <button data-layout="only-2d">2D</button>
          <button data-layout="only-3d">3D</button>
        </div>
        <span class="sep"></span>
        <span class="muted" style="font-size:12px">Explode</span>
        <input type="range" id="explode" min="0" max="100" value="0" style="width:120px;accent-color:var(--accent)" />
        <span class="spacer"></span>
        <span class="muted mono" id="cursor-pos"></span>
      </div>
      <div class="views" id="views">
        <div class="view view-2d">
          <div class="view-label" id="label-2d">2D cut layout</div>
          <div class="view-tools">
            <button class="btn" id="btn-fit-2d" title="Fit (F)">Fit</button>
            <button class="btn on" id="btn-labels-2d">Labels</button>
          </div>
          <svg id="svg2d" xmlns="http://www.w3.org/2000/svg"></svg>
          <div class="legend" id="legend-2d">
            <span><i class="swatch" style="background:var(--cut)"></i>Outer cut</span>
            <span><i class="swatch" style="background:var(--slot)"></i>Slot</span>
            <span><i class="swatch" style="background:var(--opening)"></i>Opening</span>
            <span><i class="swatch" style="background:var(--hole)"></i>Hole</span>
          </div>
          <div class="scalebar" id="scalebar-2d"></div>
          <div class="tooltip" id="tip-2d"></div>
        </div>
        <div class="view view-3d">
          <div class="view-label">3D assembly</div>
          <div class="view-tools">
            <button class="btn" data-cam="iso">Iso</button>
            <button class="btn" data-cam="front">Front</button>
            <button class="btn" data-cam="side">Side</button>
            <button class="btn" data-cam="top">Top</button>
            <button class="btn" id="btn-fit-3d">Fit</button>
            <button class="btn on" id="btn-edges">Edges</button>
          </div>
          <div id="canvas3d"></div>
          <div class="legend">
            <span><span class="dot joined"></span>Joined</span>
            <span><span class="dot cut"></span>Cut, not joined</span>
            <span><span class="dot error"></span>Has errors</span>
            <span><span class="dot" style="background:var(--accent)"></span>Selected</span>
          </div>
          <div class="tooltip" id="tip-3d"></div>
        </div>
      </div>
    </section>

    <!-- Right: inspector / validation / production -->
    <aside class="panel right">
      <div class="tabs" id="right-tabs">
        <button data-tab="inspector" class="on">Inspector</button>
        <button data-tab="validation">Validation <span class="badge" id="issue-count">0</span></button>
        <button data-tab="production">Production</button>
      </div>
      <div class="panel-body" id="tab-inspector"></div>
      <div class="panel-body" id="tab-validation" hidden></div>
      <div class="panel-body" id="tab-production" hidden></div>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="sb-units">Units: mm · +Y up · Euler XYZ</span>
    <span id="sb-material"></span>
    <span id="sb-revision"></span>
    <span class="spacer"></span>
    <span id="sb-api">API /api/v1</span>
  </footer>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/studio/main.js"></script>
</body>
</html>
