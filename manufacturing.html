<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Cut Sheets — PuzzleCore Manufacturing Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col font-sans select-none">

  <!-- Universal Shared Workbench Navbar Mount -->
  <div id="workbench-navbar-mount"></div>

  <!-- Main Layout -->
  <main class="flex-1 bg-slate-950 overflow-y-auto p-6 flex flex-col items-center">
    <div class="max-w-5xl w-full space-y-4">

      <!-- Header Card -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
        <div>
          <div class="flex items-center space-x-2">
            <h2 class="text-sm font-bold text-slate-100 uppercase tracking-wide">Laser Cutting Sheet Nesting</h2>
            <span id="sheet-count-badge" class="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 font-mono font-bold">2 Sheets</span>
          </div>
          <p id="active-sheet-desc" class="text-xs text-slate-400 mt-0.5">Kerf-compensated nesting for sheet stock fabrication.</p>
        </div>

        <!-- Sheet Selector Buttons -->
        <div class="flex items-center space-x-2">
          <div id="sheet-tabs-container" class="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-xs">
            <!-- Populated dynamically -->
          </div>

          <button id="btn-download-sheet" class="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded text-xs transition flex items-center gap-1.5 shadow-md shadow-amber-900/30">
            <span>⬇️</span><span>Download Sheet SVG</span>
          </button>
        </div>
      </div>

      <!-- Sheet Vector Preview Viewport -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl flex flex-col items-center justify-center min-h-[480px]">
        <div id="sheet-preview-mount" class="w-full flex items-center justify-center overflow-x-auto p-2">
          <!-- Nested Sheet SVG will be injected here -->
        </div>

        <!-- Legend / Cutting Guide -->
        <div class="mt-4 flex flex-wrap items-center justify-center gap-5 text-xs font-mono text-slate-400 border-t border-slate-800/80 pt-3 w-full">
          <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-red-500 inline-block"></span> Red: Perimeter & Slot Cut Paths (0.1mm)</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-sky-400 inline-block"></span> Blue: Surface Vector Engravings (0.2mm)</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-slate-500 inline-block border border-dashed border-slate-400"></span> Gray: Stock Boundary</span>
        </div>
      </div>

    </div>
  </main>

  <!-- Module Script -->
  <script type="module">
    import { AppState } from './js/core/config.js';
    import { ModelRegistry } from './js/models/registry.js';
    import { WorkbenchNav } from './js/ui/nav.js';
    import { SheetNester } from './js/manufacturing/nester.js';
    import { Toast } from './js/ui/toast.js';
    import { firebaseApp, trackEvent } from './js/core/firebase.js';

    let activeSheetNum = 1;

    function initPage() {
      WorkbenchNav.render('manufacturing');
      renderSheetPage();

      AppState.subscribe(() => {
        renderSheetPage();
      });

      document.getElementById('btn-download-sheet').addEventListener('click', () => {
        const model = ModelRegistry.getActiveModel();
        const { materialThickness } = AppState.getState();
        SheetNester.downloadSheetSVG(model, activeSheetNum, materialThickness);
        Toast.show(`Downloaded Sheet ${activeSheetNum} SVG!`, '📥');
      });
    }

    function renderSheetPage() {
      const model = ModelRegistry.getActiveModel();
      const state = AppState.getState();
      const sheets = model.manufacturingSheets || [{ sheetNum: 1, name: 'sheet_01.svg', desc: 'Standard Sheet' }];

      document.getElementById('sheet-count-badge').innerText = `${sheets.length} Sheet${sheets.length > 1 ? 's' : ''}`;

      // Build Sheet Tabs
      const tabsContainer = document.getElementById('sheet-tabs-container');
      tabsContainer.innerHTML = '';
      sheets.forEach(s => {
        const btn = document.createElement('button');
        const isActive = s.sheetNum === activeSheetNum;
        btn.className = isActive
          ? 'px-3 py-1 rounded bg-sky-600 text-white font-semibold text-xs transition shadow'
          : 'px-3 py-1 rounded text-slate-400 hover:text-slate-200 text-xs transition';
        btn.innerText = s.name;
        btn.onclick = () => {
          activeSheetNum = s.sheetNum;
          renderSheetPage();
        };
        tabsContainer.appendChild(btn);
      });

      const currentSheetDef = sheets.find(s => s.sheetNum === activeSheetNum) || sheets[0];
      document.getElementById('active-sheet-desc').innerText = currentSheetDef.desc || 'Laser cut layout.';

      // Render Sheet Vector SVG
      const result = SheetNester.generateSheetSVG(model, activeSheetNum, state.materialThickness);
      document.getElementById('sheet-preview-mount').innerHTML = result.source;
    }

    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
